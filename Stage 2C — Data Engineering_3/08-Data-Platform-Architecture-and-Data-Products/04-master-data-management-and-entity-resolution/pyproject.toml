[project]
name = "entity-resolution-mdm-lab"
version = "0.1.0"
description = "Educational MDM and entity-resolution lab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.6,<4"]
